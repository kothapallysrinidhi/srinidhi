<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekend Wanderer: AI Micro-Adventure Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weekend Wanderer 🌍</h1>
            <p>Your AI-Powered Micro-Adventure Generator</p>
        </header>

        <div class="form-card">
            <form id="adventure-form">
                <div class="form-group">
                    <label for="city">City:</label>
                    <input type="text" id="city" placeholder="e.g., Mumbai, Delhi, Bangalore" required>
                </div>
                
                <div class="form-group">
                    <label for="budget">Budget:</label>
                    <select id="budget">
                        <option value="Low (Under Rs.1000)">Low (Under Rs.1000)</option>
                        <option value="Medium (Rs.1000 - Rs.3000)">Medium (Rs.1000 - Rs.3000)</option>
                        <option value="High (Above Rs.3000)">High (Above Rs.3000)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="interests">Interests (Separate with commas):</label>
                    <input type="text" id="interests" placeholder="e.g., Nature, Street Food, History" required>
                </div>

                <button type="submit">Generate Adventure ✨</button>
            </form>
        </div>

        <div id="loading" class="hidden">
            <p>Planning your adventure... 🗺️</p>
        </div>

        <div id="result" class="result-card hidden">
            <!-- AI result will be injected here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
